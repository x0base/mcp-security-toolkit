[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-security-toolkit"
version = "0.3.0"
description = "Atomic MCP tools for AppSec and AI Security engineers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "x0base" }]
keywords = ["mcp", "security", "appsec", "ai-security", "red-team", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
mcp-security-toolkit = "mcp_security_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/x0base/mcp-security-toolkit"
Issues = "https://github.com/x0base/mcp-security-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mcp_security_toolkit",
    "tests",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "THREAT_MODEL.md",
    "CONTRIBUTING.md",
    "PLAN.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM102", "SIM103", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/mcp_security_toolkit/tools/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
